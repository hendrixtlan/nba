$schema: https://azuremlschemas.azureedge.net/latest/managedOnlineDeployment.schema.json
name: blue
endpoint_name: latam-nba-propensity
model: azureml:latam-nba-propensity:1
code_configuration:
  code: ../..
  scoring_script: azureml/inference/score.py
environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04:latest
  conda_file: ../inference/conda.yml
instance_type: Standard_DS3_v2
instance_count: 1
request_settings:
  request_timeout_ms: 10000
  max_concurrent_requests_per_instance: 8
liveness_probe:
  initial_delay: 10
  period: 10
readiness_probe:
  initial_delay: 10
  period: 10
