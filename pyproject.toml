[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latam-nba-agent"
version = "0.4.0"
description = "Production-shaped Next Best Action and agentic AI reference architecture"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pandas>=2.2,<3",
  "numpy>=2.0,<3",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
  "PyYAML>=6.0,<7"
]

[project.optional-dependencies]
ml = [
  "xgboost>=3.0,<4",
  "shap>=0.49,<1"
]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "httpx>=0.27,<1",
  "ruff>=0.7,<1",
  "mypy>=1.11,<2"
]

agent = [
  "langgraph",
  "langchain-core",
  "langchain-azure-ai",
  "azure-ai-projects>=2.4.0",
  "azure-identity>=1.19,<2",
  "opentelemetry-sdk",
  "azure-core-tracing-opentelemetry"
]
azure = [
  "azure-identity>=1.19,<2",
  "azure-storage-file-datalake>=12.18,<13",
  "azure-ai-ml>=1.26,<2"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
